<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccessBuild Dashboard | App Accessibility Scores</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root {
            --black: #0A0A0A;
            --card: #141414;
            --border: #222222;
            --gold: #C9A96E;
            --gold-dark: #A6844B;
            --green: #00C853;
            --red: #FF3B30;
            --orange: #FF9500;
            --yellow: #FFCC00;
            --white: #FFFFFF;
            --grey: #888888;
            --font-ui: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-ui);
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── TOP BAR ── */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .brand i {
            color: var(--gold);
            font-size: 1.3rem;
        }

        .brand span {
            color: var(--gold);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--grey);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── MAIN ── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 24px 60px;
        }

        .hero {
            text-align: center;
            margin-bottom: 48px;
        }

        .hero-badge {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gold);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 16px;
            margin-bottom: 20px;
        }

        .hero-title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }

        .hero-title span {
            color: var(--gold);
        }

        .hero-sub {
            font-size: 1rem;
            color: var(--grey);
            max-width: 500px;
            margin: 0 auto;
        }

        /* ── STATS BAR ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
        }

        .stat-label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--grey);
            margin-bottom: 8px;
        }

        .stat-value {
            font-family: var(--font-mono);
            font-size: 2rem;
            font-weight: 600;
            color: var(--gold);
        }

        /* ── FILTER TABS ── */
        .filter-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .filter-btn {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--grey);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .filter-btn.active {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--black);
        }

        /* ── APP GRID ── */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .app-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            transition: all 0.3s ease;
            animation: fadeUp 0.4s ease;
        }

        .app-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(201, 169, 110, 0.15);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .app-name {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.3;
        }

        .score-badge {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        .score-A { background: rgba(0, 200, 83, 0.15); color: var(--green); }
        .score-B { background: rgba(0, 200, 83, 0.1); color: #66BB6A; }
        .score-C { background: rgba(255, 204, 0, 0.15); color: var(--yellow); }
        .score-D { background: rgba(255, 149, 0, 0.15); color: var(--orange); }
        .score-F { background: rgba(255, 59, 48, 0.15); color: var(--red); }

        .app-details {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--grey);
            margin-bottom: 12px;
        }

        .app-details span {
            display: block;
            margin-bottom: 4px;
        }

        .app-recommendation {
            font-size: 0.85rem;
            color: var(--grey);
            line-height: 1.5;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        /* ── EMPTY STATE ── */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--grey);
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--border);
            margin-bottom: 16px;
            display: block;
        }

        /* ── LOADING ── */
        .loading {
            text-align: center;
            padding: 60px;
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── FOOTER ── */
        .footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border);
            margin-top: 60px;
        }

        .footer p {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--grey);
        }

        .footer a {
            color: var(--gold);
            text-decoration: none;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 992px) {
            .app-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .container { padding: 90px 16px 40px; }
            .stats-grid { grid-template-columns: 1fr; }
            .app-grid { grid-template-columns: 1fr; }
            .topbar { padding: 0 16px; }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <header class="topbar">
        <div class="brand">
            <i class="fa-solid fa-universal-access"></i>
            Access<span>Build</span>
        </div>
        <div class="status">
            <span class="status-dot"></span>
            <span>API Live</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">

        <!-- Hero -->
        <div class="hero">
            <span class="hero-badge">Accessibility Audit Dashboard</span>
            <h1 class="hero-title">Every App. <span>Scored.</span></h1>
            <p class="hero-sub">Real accessibility audit results from mobile apps. Powered by AccessBuild API.</p>
        </div>

        <!-- Stats Bar -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">Total Audits</div>
                <div class="stat-value" id="totalAudits">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Average Accessibility</div>
                <div class="stat-value" id="avgAccessibility">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Grade Distribution</div>
                <div class="stat-value" id="gradeDist">—</div>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs" id="filterTabs">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="A">A</button>
            <button class="filter-btn" data-filter="B">B</button>
            <button class="filter-btn" data-filter="C">C</button>
            <button class="filter-btn" data-filter="D">D</button>
            <button class="filter-btn" data-filter="F">F</button>
        </div>

        <!-- App Grid -->
        <div class="app-grid" id="appGrid">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>AccessBuild v2.0 | Built by <a href="https://github.com/Dexter2344" target="_blank">Dexter</a> | API: accessbuild-api.onrender.com</p>
        </footer>

    </main>

    <script>
        const API_URL = "https://accessbuild-api.onrender.com";
        let allAudits = [];
        let currentFilter = "all";

        // Grade colors
        function getScoreClass(score) {
            return "score-" + score;
        }

        // Fetch stats
        async function fetchStats() {
            try {
                const res = await fetch(`${API_URL}/stats`);
                const data = await res.json();

                document.getElementById("totalAudits").textContent = data.total_audits || 0;
                document.getElementById("avgAccessibility").textContent = (data.average_accessibility || 0) + "%";

                const dist = data.grade_distribution || {};
                const distText = Object.keys(dist).length > 0
                    ? Object.entries(dist).map(([k, v]) => `${k}:${v}`).join(" ")
                    : "—";
                document.getElementById("gradeDist").textContent = distText;

            } catch (err) {
                console.error("Stats error:", err);
            }
        }

        // Fetch audits
        async function fetchAudits() {
            try {
                const res = await fetch(`${API_URL}/audits/recent?limit=50`);
                const data = await res.json();
                allAudits = data.audits || [];
                renderAudits();
            } catch (err) {
                console.error("Audits error:", err);
                document.getElementById("appGrid").innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <p>Could not load audits. Check API status.</p>
                    </div>
                `;
            }
        }

        // Render audit cards
        function renderAudits() {
            const grid = document.getElementById("appGrid");
            const filtered = currentFilter === "all"
                ? allAudits
                : allAudits.filter(a => a.score === currentFilter);

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <p>No audits found for grade ${currentFilter}.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(a => `
                <div class="app-card">
                    <div class="app-header">
                        <div class="app-name">${a.app_name || "Unknown App"}</div>
                        <span class="score-badge ${getScoreClass(a.score)}">${a.score || "?"}</span>
                    </div>
                    <div class="app-details">
                        <span><i class="fa-solid fa-mobile-screen"></i> ${a.package_name || "No package"}</span>
                        <span><i class="fa-solid fa-percent"></i> ${a.accessibility_percentage || 0}% accessible</span>
                        <span><i class="fa-solid fa-list"></i> ${a.labeled_elements || 0}/${a.total_elements || 0} elements labeled</span>
                    </div>
                    <div class="app-recommendation">
                        ${a.recommendation || "No recommendation."}
                    </div>
                </div>
            `).join("");
        }

        // Filter tabs
        document.querySelectorAll(".filter-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentFilter = btn.dataset.filter;
                renderAudits();
            });
        });

        // Init
        fetchStats();
        fetchAudits();
    </script>
</body>
</html>
